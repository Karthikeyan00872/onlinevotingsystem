<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Voting System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div id="admin-login-page" class="page active">
            <div class="header">
                <button class="btn-back" onclick="goBackToMain()">
                    <i class="fas fa-arrow-left"></i> Back to Main
                </button>
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <h1>Admin Panel</h1>
                </div>
                <p class="tagline">Secure Admin Access</p>
            </div>

            <div class="auth-form">
                <form id="admin-login-form">
                    <h2>Admin Login</h2>
                    
                    <div class="form-group">
                        <label for="admin-username">
                            <i class="fas fa-user-shield"></i> Admin Username
                        </label>
                        <input type="text" id="admin-username" placeholder="Enter admin username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="admin-password">
                            <i class="fas fa-lock"></i> Admin Password
                        </label>
                        <input type="password" id="admin-password" placeholder="Enter admin password" required>
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('admin-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-sign-in-alt"></i> Login as Admin
                    </button>
                </form>
            </div>
        </div>

        <div id="admin-dashboard-page" class="page">
            <div class="header">
                <button class="btn-back" onclick="adminLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
                <h2>Admin Dashboard</h2>
                <p id="admin-welcome">Welcome, Admin</p>
            </div>

            <div class="dashboard-content">
                <div class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="total-voters">0</h3>
                            <p>Total Verified Voters</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-vote-yea"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="total-votes">0</h3>
                            <p>Total Votes Cast</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-percentage"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="voting-percentage">0%</h3>
                            <p>Voting Percentage</p>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="total-candidates">0</h3>
                            <p>Total Candidates</p>
                        </div>
                    </div>
                </div>

                <div class="admin-sections">
                    <div class="admin-section">
                        <h3><i class="fas fa-chart-bar"></i> Voting Results</h3>
                        <div id="results-container">
                            <div class="loading">Loading results...</div>
                        </div>
                        <button class="btn btn-primary" onclick="refreshResults()">
                            <i class="fas fa-sync-alt"></i> Refresh Results
                        </button>
                    </div>
                    
                    <div class="admin-section">
                        <h3><i class="fas fa-user-plus"></i> Add Candidate</h3>
                        <div class="form-group">
                            <label for="candidate-name">Candidate Name</label>
                            <input type="text" id="candidate-name" placeholder="Enter candidate name">
                        </div>
                        <div class="form-group">
                            <label for="candidate-party">Party</label>
                            <input type="text" id="candidate-party" placeholder="Enter party name">
                        </div>
                        <button class="btn btn-primary" onclick="addCandidate()">
                            <i class="fas fa-plus"></i> Add Candidate
                        </button>
                        <div id="candidate-result"></div>
                    </div>
                    
                    <div class="admin-section">
                        <h3><i class="fas fa-user-minus"></i> Remove Candidate</h3>
                        <div class="form-group">
                            <label for="remove-candidate-id">Candidate ID</label>
                            <input type="number" id="remove-candidate-id" placeholder="Enter candidate ID to remove">
                        </div>
                        <button class="btn btn-danger" onclick="removeCandidate()">
                            <i class="fas fa-trash"></i> Remove Candidate
                        </button>
                        <div id="remove-candidate-result"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-modal" class="modal">
        <div class="modal-content">
            <div class="spinner"></div>
            <p id="loading-text">Loading...</p>
        </div>
    </div>

    <div id="message-modal" class="modal">
        <div class="modal-content">
            <div id="message-icon"></div>
            <h3 id="message-title"></h3>
            <p id="message-content"></p>
            <button id="message-close" class="btn btn-primary">OK</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';

        // Page functions
        function goBackToMain() {
            window.location.href = '/';
        }

        function adminLogout() {
            localStorage.removeItem('admin_username');
            showPage('admin-login-page');
            document.getElementById('admin-login-form').reset();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Modal functions
        function showModal(modalId, show = true) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = show ? 'flex' : 'none';
            }
        }

        function showMessage(type, title, message) {
            const icon = document.getElementById('message-icon');
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle" style="color: #28a745; font-size: 50px;"></i>';
            } else {
                icon.innerHTML = '<i class="fas fa-times-circle" style="color: #dc3545; font-size: 50px;"></i>';
            }
            
            document.getElementById('message-title').textContent = title;
            document.getElementById('message-content').textContent = message;
            document.getElementById('message-close').onclick = () => showModal('message-modal', false);
            showModal('message-modal', true);
        }

        // Admin login
        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('admin-username').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            
            if (!username || !password) {
                showMessage('error', 'Error', 'Enter admin credentials');
                return;
            }
            
            showModal('loading-modal', true);
            document.getElementById('loading-text').textContent = 'Logging in...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin_login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                showModal('loading-modal', false);
                
                if (data.success) {
                    localStorage.setItem('admin_username', username);
                    document.getElementById('admin-welcome').textContent = `Welcome, ${data.admin.username}`;
                    showPage('admin-dashboard-page');
                    loadAdminDashboard();
                } else {
                    showMessage('error', 'Login Failed', data.message);
                }
            } catch (error) {
                showModal('loading-modal', false);
                showMessage('error', 'Connection Error', 'Failed to connect to server');
            }
        });

        // Admin dashboard functions
        async function loadAdminDashboard() {
            showModal('loading-modal', true);
            document.getElementById('loading-text').textContent = 'Loading dashboard...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/get_results`);
                const data = await response.json();
                showModal('loading-modal', false);
                
                if (data.success) {
                    updateStats(data.statistics);
                    displayResults(data.results);
                } else {
                    showMessage('error', 'Error', data.message);
                }
            } catch (error) {
                showModal('loading-modal', false);
                showMessage('error', 'Error', 'Failed to load dashboard');
            }
        }

        function updateStats(stats) {
            document.getElementById('total-voters').textContent = stats.total_voters || 0;
            document.getElementById('total-votes').textContent = stats.total_votes || 0;
            document.getElementById('voting-percentage').textContent = stats.voting_percentage + '%' || '0%';
            document.getElementById('total-candidates').textContent = stats.total_candidates || 0;
        }

        function displayResults(results) {
            const container = document.getElementById('results-container');
            
            if (!results || results.length === 0) {
                container.innerHTML = `
                    <div class="note">
                        <i class="fas fa-info-circle"></i> No voting results available yet.
                    </div>
                `;
                return;
            }
            
            let html = '<div class="results-table">';
            html += '<div class="table-header">';
            html += '<div class="table-cell">Candidate ID</div>';
            html += '<div class="table-cell">Candidate</div>';
            html += '<div class="table-cell">Party</div>';
            html += '<div class="table-cell">Votes</div>';
            html += '</div>';
            
            results.forEach(result => {
                html += '<div class="table-row">';
                html += `<div class="table-cell">${result._id || 'N/A'}</div>`;
                html += `<div class="table-cell">${result.candidate_name || 'N/A'}</div>`;
                html += `<div class="table-cell">${result.candidate_party || 'N/A'}</div>`;
                html += `<div class="table-cell">${result.total_votes || 0}</div>`;
                html += '</div>';
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function refreshResults() {
            loadAdminDashboard();
        }

        async function addCandidate() {
            const name = document.getElementById('candidate-name').value.trim();
            const party = document.getElementById('candidate-party').value.trim();
            
            if (!name || !party) {
                showMessage('error', 'Error', 'Enter candidate name and party');
                return;
            }
            
            showModal('loading-modal', true);
            document.getElementById('loading-text').textContent = 'Adding candidate...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/add_candidate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, party })
                });
                
                const data = await response.json();
                showModal('loading-modal', false);
                
                if (data.success) {
                    document.getElementById('candidate-result').innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle"></i> ${data.message}
                        </div>
                    `;
                    document.getElementById('candidate-name').value = '';
                    document.getElementById('candidate-party').value = '';
                    setTimeout(() => {
                        document.getElementById('candidate-result').innerHTML = '';
                    }, 3000);
                    refreshResults();
                } else {
                    showMessage('error', 'Error', data.message);
                }
            } catch (error) {
                showModal('loading-modal', false);
                showMessage('error', 'Error', 'Failed to add candidate');
            }
        }

        async function removeCandidate() {
            const candidateId = parseInt(document.getElementById('remove-candidate-id').value.trim());
            
            if (!candidateId || isNaN(candidateId)) {
                showMessage('error', 'Error', 'Enter valid candidate ID');
                return;
            }
            
            if (!confirm(`Are you sure you want to remove candidate with ID ${candidateId}?`)) {
                return;
            }
            
            showModal('loading-modal', true);
            document.getElementById('loading-text').textContent = 'Removing candidate...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/remove_candidate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ candidate_id: candidateId })
                });
                
                const data = await response.json();
                showModal('loading-modal', false);
                
                if (data.success) {
                    document.getElementById('remove-candidate-result').innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle"></i> ${data.message}
                        </div>
                    `;
                    document.getElementById('remove-candidate-id').value = '';
                    setTimeout(() => {
                        document.getElementById('remove-candidate-result').innerHTML = '';
                    }, 3000);
                    refreshResults();
                } else {
                    showMessage('error', 'Error', data.message);
                }
            } catch (error) {
                showModal('loading-modal', false);
                showMessage('error', 'Error', 'Failed to remove candidate');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in as admin
            const adminUsername = localStorage.getItem('admin_username');
            if (adminUsername) {
                document.getElementById('admin-welcome').textContent = `Welcome, ${adminUsername}`;
                showPage('admin-dashboard-page');
                loadAdminDashboard();
            }
            
            // Setup modal close button
            const closeBtn = document.getElementById('message-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    showModal('message-modal', false);
                });
            }
            
            // Close modals when clicking outside
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        showModal(modal.id, false);
                    }
                });
            });
        });
    </script>

    <style>
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stat-icon i {
            font-size: 24px;
            color: white;
        }
        
        .stat-info h3 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-info p {
            color: #666;
            font-size: 14px;
        }
        
        .admin-sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .admin-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }
        
        .admin-section h3 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .results-table {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e9ecef;
        }
        
        .table-header {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr 1fr;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
        }
        
        .table-row {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr 1fr;
            border-bottom: 1px solid #e9ecef;
        }
        
        .table-row:nth-child(even) {
            background: #f8f9fa;
        }
        
        .table-row:hover {
            background: #e9ecef;
        }
        
        .table-cell {
            padding: 15px;
            display: flex;
            align-items: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #c82333, #bd2130);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3);
        }
        
        @media (max-width: 768px) {
            .admin-sections {
                grid-template-columns: 1fr;
            }
            
            .table-header {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
            
            .table-row {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
            
            .table-cell {
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</body>
</html>
